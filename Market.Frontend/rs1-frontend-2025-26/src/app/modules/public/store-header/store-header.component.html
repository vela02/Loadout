<header class="store-header">
  <div class="container d-flex align-items-center justify-content-between">
    <!-- Logo = link na početnu -->
    <a routerLink="/" class="brand">
      <mat-icon class="brand-icon">sports_esports</mat-icon>
      <span class="brand-name">Loadout</span>
    </a>

    <div class="d-flex align-items-center gap-2">
    <!-- Korpa (samo za prijavljene) ili link za prijavu -->
    @if (isLoggedIn()) {
      <a routerLink="/client/orders" class="icon-button" [attr.aria-label]="'GAMES.ORDERS.TITLE' | translate"
         [title]="'GAMES.ORDERS.TITLE' | translate">
        <mat-icon>receipt_long</mat-icon>
      </a>
      <a routerLink="/cart" class="icon-button" [attr.aria-label]="'GAMES.CART.TITLE' | translate">
        <mat-icon>shopping_cart</mat-icon>
        @if ((cartCount$ | async); as count) {
          <span class="cart-badge">{{ count }}</span>
        }
      </a>
    } @else {
      <a routerLink="/auth/login" class="login-link">{{ 'GAMES.HEADER.LOGIN' | translate }}</a>
    }

    <!-- Izbor jezika -->
    <button type="button" class="lang-button" [matMenuTriggerFor]="langMenu">
      <span class="flag">{{ current?.flag }}</span>
      <span class="code">{{ currentLang }}</span>
      <mat-icon>expand_more</mat-icon>
    </button>
    <mat-menu #langMenu="matMenu" xPosition="before">
      @for (lang of languages; track lang.code) {
        <button mat-menu-item (click)="switchLanguage(lang.code)">
          <span class="me-2">{{ lang.flag }}</span>
          <span>{{ lang.name }}</span>
          @if (currentLang === lang.code) { <mat-icon>check</mat-icon> }
        </button>
      }
    </mat-menu>
    </div>
  </div>
</header>
